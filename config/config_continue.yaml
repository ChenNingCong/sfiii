# Replication of the best 2026 run (08:35AM-on-March-11-2026, max reward 21.5)
# with the adaptive-LR BLOWUP FIX (max_multiplier: 1.0) and run on the new
# fault-tolerant multiprocess engine stack (MPVecEnv) so it can train to completion
# instead of crashing at ~9.5M steps.
num_envs: 12
spares_per_worker: 1
base_port: 52000
prefix: curr
folders:
  parent_dir: ./results/
  model_name: sr6_128x4_das_nc
settings:
  game_id: sfiii3n
  step_ratio: 1
  frame_shape: [128, 128, 1]
  continue_game: 0.0
  action_space: multi_discrete        # = 2 in the original config (the best run used MULTI_DISCRETE)
  characters: Ryu
  difficulty: 6
  outfits: 2
wrappers_settings:
  normalize_reward: true
  normalization_factor: 0.2           # from the best run's diff.patch
  stack_frames: 4
  dilation: 6
  add_last_action: true
  stack_actions: 6
  scale: true
  exclude_image_scaling: true
  role_relative: true
  flatten: true
  filter_keys:
  - action
  - own_health
  - opp_health
  - own_side
  - opp_side
  - opp_character
  - stage
  - timer
policy_kwargs:
  net_arch:
  - 64
  - 64
ppo_settings:
  gamma: 0.99
  model_checkpoint: '0'
  learning_rate:
  - 0.00025
  - 2.5e-06
  clip_range:
  - 0.15
  - 0.025
  batch_size: 256
  n_epochs: 4
  n_steps: 128
  autosave_freq: 1000000
  time_steps: 20000000
  ent_coef: 0.0001
  target_kl: 0.01
  # adaptive KL-LR (Rudin et al.) + blowup fix
  adaptive_lr_floor: 1.0e-5
  adaptive_lr_cap_early: 2.5e-4
  adaptive_lr_cap_late: 8.0e-4
  adaptive_lr_timestep_threshold: 2000000
  adaptive_lr_early_stop_decay: 1.2
  adaptive_lr_max_multiplier: 1.0     # THE FIX: effective LR never exceeds base schedule
# per-env continue_game (len num_envs): 0=reset-on-loss (diversity),
# 1.0=10 retries, negative=exact count (e.g. -30 = 30 retries -> persist at frontier).
# Shapes stage coverage: persistent envs hold late stages instead of dropping to stage 1.
continue_game_schedule: [0, 0, 0, 0, 1.0, 1.0, 1.0, -10, -20, -20, -50, -50]
