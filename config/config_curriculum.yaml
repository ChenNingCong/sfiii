# Late-stage CURRICULUM run: bootstrap from the main run's 17M checkpoint and train
# further with a per-env continue_game schedule that oversamples the frontier (stages
# 5-8). Goal: break the ~stage-5 plateau by giving the agent many retries where it
# fails instead of resetting to stage 1. Runs ALONGSIDE the finetune run.
# Monitor stats/clean_max_stage (continue-INVARIANT) — NOT max_stage (inflated by retries).
num_envs: 16
spares_per_worker: 0
base_port: 56000
prefix: cg
folders:
  parent_dir: ./results/
  model_name: async_curriculum
settings:
  game_id: sfiii3n
  step_ratio: 1
  frame_shape: [128, 128, 1]
  continue_game: 0.0
  action_space: multi_discrete
  characters: Ryu
  difficulty: 6
  outfits: 2
wrappers_settings:
  normalize_reward: true
  normalization_factor: 0.2
  stack_frames: 4
  dilation: 6
  add_last_action: true
  stack_actions: 6
  scale: true
  exclude_image_scaling: true
  role_relative: true
  flatten: true
  filter_keys:
  - action
  - own_health
  - opp_health
  - own_side
  - opp_side
  - opp_character
  - stage
  - timer
policy_kwargs:
  net_arch:
  - 64
  - 64
ppo_settings:
  gamma: 0.99
  model_checkpoint: 'results/02:38PM-Jun-14-2026_cleanrl_228876/model/ckpt_17000802.pt'
  learning_rate:
  - 1.0e-4
  - 0.0
  lr_warmup_steps: 500000      # ramp 0->1e-4 over first 500k so the bootstrapped
                               # converged policy isn't kicked apart on the first updates
  clip_range:
  - 0.15
  - 0.025
  batch_size: 256
  n_epochs: 4
  n_steps: 128
  autosave_freq: 1000000
  time_steps: 20000000
  ent_coef: 0.0001
  target_kl: 0.01
  adaptive_lr_floor: 1.0e-6
  adaptive_lr_cap_early: 1.0e-4
  adaptive_lr_cap_late: 1.0e-4
  adaptive_lr_timestep_threshold: 2000000
  adaptive_lr_early_stop_decay: 1.2
  adaptive_lr_max_multiplier: 1.0
  async_collect: true
# per-env continue_game (len=16): 4 clean (0, diversity + clean_max_stage signal),
# 4 at 1.0 (10 retries), 8 heavy (-20/-50 = persist at the frontier). Biased to late stages.
continue_game_schedule: [0, 0, 0, 0, 1.0, 1.0, 1.0, 1.0, -20, -20, -20, -20, -50, -50, -50, -50]
