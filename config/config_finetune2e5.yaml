# Finetune/continuation run: bootstrap from the main async run's newest checkpoint and
# train a FRESH 20M with a small LR (2e-5 -> 0 linear decay). Runs ALONGSIDE the main
# run (distinct base_port/prefix). Adaptive-KL controller kept ON but bounded
# (max_multiplier 1.0, low floor) so effective LR <= the 2e-5 schedule with KL safety.
num_envs: 16
spares_per_worker: 0
base_port: 55000
prefix: ft
folders:
  parent_dir: ./results/
  model_name: async_ft2e5
settings:
  game_id: sfiii3n
  step_ratio: 1
  frame_shape: [128, 128, 1]
  continue_game: 0.0
  action_space: multi_discrete
  characters: Ryu
  difficulty: 6
  outfits: 2
wrappers_settings:
  normalize_reward: true
  normalization_factor: 0.2
  stack_frames: 4
  dilation: 6
  add_last_action: true
  stack_actions: 6
  scale: true
  exclude_image_scaling: true
  role_relative: true
  flatten: true
  filter_keys:
  - action
  - own_health
  - opp_health
  - own_side
  - opp_side
  - opp_character
  - stage
  - timer
policy_kwargs:
  net_arch:
  - 64
  - 64
ppo_settings:
  gamma: 0.99
  model_checkpoint: 'results/02:38PM-Jun-14-2026_cleanrl_228876/model/ckpt_17000802.pt'
  learning_rate:
  - 2.0e-5
  - 0.0
  clip_range:
  - 0.15
  - 0.025
  batch_size: 256
  n_epochs: 4
  n_steps: 128
  autosave_freq: 1000000
  time_steps: 20000000
  ent_coef: 0.0001
  target_kl: 0.01
  adaptive_lr_floor: 1.0e-7
  adaptive_lr_cap_early: 2.0e-5
  adaptive_lr_cap_late: 2.0e-5
  adaptive_lr_timestep_threshold: 2000000
  adaptive_lr_early_stop_decay: 1.2
  adaptive_lr_max_multiplier: 1.0
  async_collect: true
