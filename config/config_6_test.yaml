num_envs: 8
folders:
  parent_dir: ./results/
  model_name: sr6_128x4_das_nc
settings:
  game_id: sfiii3n
  step_ratio: 6
  frame_shape: !!python/tuple [128, 128, 1]
  continue_game: 0.0
  action_space: 2
  characters: Ryu
  difficulty: 8
  outfits: 2
  role: 2
wrappers_settings:
  normalize_reward: true
  normalization_factor: 0.5
  stack_frames: 4
  dilation: 6
  add_last_action: true
  stack_actions: 6
  scale: true
  exclude_image_scaling: true
  role_relative: true
  flatten: true
  filter_keys:
  - action
  - own_health
  - opp_health
  - own_side
  - opp_side
  - opp_character
  - stage
  - timer
policy_kwargs:
  net_arch:
  - 64
  - 64
ppo_settings:
  gamma: 1
  model_checkpoint: '0'
  learning_rate:
  - 0.00025
  - 2.5e-06
  clip_range:
  - 0.15
  - 0.025
  batch_size: 256
  n_epochs: 4
  n_steps: 128
  autosave_freq: 10_0000
  time_steps: 200000000
  ent_coef: 0.0001
  target_kl: 0.01
  # adaptive KL LR tuning (optional — defaults shown)
  # adaptive_lr_floor: 1.0e-5
  adaptive_lr_cap_early: 2.5e-4
  # adaptive_lr_cap_late: 8.0e-4
  # adaptive_lr_timestep_threshold: 2000000
  # adaptive_lr_early_stop_decay: 1.2